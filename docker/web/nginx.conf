server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Re-resolve the api service name through Docker's embedded DNS instead of
    # pinning the IP nginx saw at startup. Without this, recreating the api
    # container (every `compose up --build api`) leaves nginx proxying to a
    # stale address and the UI answers 502 until web is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Compress text assets; the main bundle is ~850KB uncompressed and the
    # operators often reach this UI over slow or lossy links.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml font/woff2 application/wasm;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
    location = /healthz { proxy_pass $api_upstream/healthz; }
    location = /readyz  { proxy_pass $api_upstream/readyz; }

    # Vite emits content-hashed filenames under /assets, so they can be cached forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
